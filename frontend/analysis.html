<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClawIntel — Lab</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <div class="page-header-left">
      <div class="logo-mark">CI</div>
      <div class="logo-text">CLAW INTEL</div>
      <nav class="page-nav">
        <a href="../index.html" class="nav-link">Dashboard</a>
        <a href="history.html" class="nav-link">Records</a>
        <a href="markets.html" class="nav-link">Markets</a>
        <a href="analysis.html" class="nav-link active">Forensic Lab</a>
      </nav>
    </div>
  </header>

  <div class="page-container">
    <div class="analysis-hero">
      <h1>ClawIntel Lab</h1>
      <p>Paste any token contract address and let the agent swarm conduct a full forensic analysis.</p>
    </div>

    <div class="scan-form">
      <div class="scan-form-row">
        <div>
          <label>Token Contract Address</label>
          <input type="text" class="form-input" id="token-address" placeholder="0x... or any token address">
        </div>
        <div>
          <label>Chain</label>
          <select class="form-input chain-select" id="chain-select">
            <option value="bsc">BSC</option>
            <option value="ethereum">Ethereum</option>
            <option value="solana">Solana</option>
            <option value="base">Base</option>
          </select>
        </div>
        <div>
          <label>&nbsp;</label>
          <button class="btn btn-primary btn-lg scan-btn" id="scan-btn" onclick="lab.startInvestigation()">
            <span id="scan-btn-text">Scan</span>
          </button>
        </div>
      </div>
      <!-- scan-progress and token-summary are generated internally by analysis.js -->
    </div>

    <div class="investigation-log">
      <div class="investigation-log-header">
        <h3>Investigation Log</h3>
        <div class="investigation-status" id="investigation-status"><span>Waiting for input...</span></div>
      </div>
      <div class="investigation-messages" id="investigation-messages">
        <div class="investigation-empty" id="investigation-empty">
          <div class="empty-state-title">Lab agents are fully ready</div>
          <div class="empty-state-desc">Paste a contract address above and click Scan to begin.</div>
        </div>
      </div>
    </div>

    <div id="verdict-container"></div>
  </div>

  <script src="analysis.js" type="module"></script>
</body>
</html>
