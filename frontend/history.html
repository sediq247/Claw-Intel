<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History — ClawIntel</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-card: #1a1a24;
      --border-color: #2a2a3a;
      --text-primary: #e8e8f0;
      --text-secondary: #a0a0b0;
      --text-muted: #606070;
      --nova: #00e5ff;
      --safe: #00c853;
      --warning: #ffb300;
      --danger: #ff1744;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
    }
    .nav {
      display: flex;
      align-items: center;
      gap: 2rem;
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-secondary);
    }
    .nav a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
    }
    .nav a:hover, .nav a.active {
      color: var(--nova);
    }
    .nav-brand {
      font-weight: 700;
      font-size: 1.2rem;
      color: var(--nova);
      margin-right: auto;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }
    .page-header {
      margin-bottom: 2rem;
    }
    .page-header h1 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }
    .page-header p {
      color: var(--text-secondary);
    }
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.2rem;
      text-align: center;
    }
    .stat-value {
      font-size: 1.8rem;
      font-weight: 700;
      font-family: var(--font-mono);
    }
    .stat-value.total { color: var(--nova); }
    .stat-value.safe { color: var(--safe); }
    .stat-value.warning { color: var(--warning); }
    .stat-value.risk { color: var(--danger); }
    .stat-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.3rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .filters {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .filters select, .filters input {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 0.6rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }
    .filters input {
      flex: 1;
      min-width: 250px;
    }
    .filters select:focus, .filters input:focus {
      border-color: var(--nova);
    }
    .investigation-list {
      display: grid;
      gap: 1rem;
    }
    .investigation-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.2rem;
      transition: border-color 0.2s;
    }
    .investigation-card:hover {
      border-color: var(--nova);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
    }
    .token-info {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .token-symbol {
      font-size: 1.2rem;
      font-weight: 700;
    }
    .token-chain {
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      background: rgba(0, 229, 255, 0.1);
      color: var(--nova);
      border-radius: 4px;
      text-transform: uppercase;
    }
    .verdict-badge {
      font-size: 0.8rem;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      font-weight: 600;
    }
    .card-body {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.6rem;
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
    }
    .detail-label {
      color: var(--text-muted);
    }
    .detail-value {
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-size: 0.8rem;
    }
    .card-reasoning {
      margin-top: 0.8rem;
      padding-top: 0.8rem;
      border-top: 1px solid var(--border-color);
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-muted);
    }
    .loading {
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
    }
    .chat-log {
      margin-top: 2rem;
    }
    .chat-log h2 {
      font-size: 1.2rem;
      margin-bottom: 1rem;
      color: var(--text-secondary);
    }
    .chat-message {
      display: flex;
      gap: 0.8rem;
      padding: 0.8rem 1rem;
      border-left: 3px solid var(--border-color);
      margin-bottom: 0.5rem;
      background: var(--bg-secondary);
      border-radius: 0 8px 8px 0;
    }
    .chat-message.agent-Nova { border-left-color: var(--nova); }
    .chat-message.agent-Atlas { border-left-color: #00c853; }
    .chat-message.agent-Vega { border-left-color: #ffb300; }
    .chat-message.agent-Echo { border-left-color: #aa66ff; }
    .chat-message.agent-Orion { border-left-color: #ff1744; }
    .chat-agent {
      font-weight: 600;
      font-size: 0.8rem;
      min-width: 60px;
      text-transform: uppercase;
    }
    .chat-text {
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.4;
    }
    .chat-time {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-left: auto;
      white-space: nowrap;
    }
    @media (max-width: 768px) {
      .stats-bar { grid-template-columns: repeat(2, 1fr); }
      .filters { flex-direction: column; }
      .filters input { min-width: unset; }
    }
  </style>
</head>
<body>
  <header class="page-header">
    <div class="page-header-left">
      <div class="logo-mark">CI</div>
      <div class="logo-text">CLAW INTEL</div>
      <nav class="page-nav">
        <a href="../index.html" class="nav-btn">Dashboard</a>
        <a href="history.html" class="nav-link active">Records</a>
        <a href="markets.html" class="nav-link">Markets</a>
        <a href="analysis.html" class="nav-link">Forensic Lab</a>
      </nav>
    </div>
  </header>
<div class="page-container">
    <h1 class="page-title">Forensics Records</h1>
    <p class="page-subtitle">Every token the swarm has analyzed, archived and searchable.</p>

    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-value total" id="stat-total">—</div>
        <div class="stat-label">Total Scanned</div>
      </div>
      <div class="stat-card">
        <div class="stat-value safe" id="stat-safe">—</div>
        <div class="stat-label">Safe</div>
      </div>
      <div class="stat-card">
        <div class="stat-value warning" id="stat-warning">—</div>
        <div class="stat-label">Warning</div>
      </div>
      <div class="stat-card">
        <div class="stat-value risk" id="stat-risk">—</div>
        <div class="stat-label">High Risk</div>
      </div>
    </div>

    <div class="filters">
      <select id="filter-verdict">
        <option value="all">All Verdicts</option>
        <option value="SAFE">Safe</option>
        <option value="WARNING">Warning</option>
        <option value="HIGH_RISK">High Risk</option>
      </select>
      <select id="filter-chain">
        <option value="all">All Chains</option>
        <option value="ethereum">Ethereum</option>
        <option value="bsc">BSC</option>
        <option value="base">Base</option>
        <option value="solana">Solana</option>
      </select>
      <input type="text" id="search-token" placeholder="Search token address or symbol...">
    </div>

    <div class="investigation-list" id="investigation-list">
      <div class="loading">Loading investigation history...</div>
    </div>

    <div class="chat-log" id="chat-log-section" style="display: none;">
      <h2>🗨️ Agent Conversations</h2>
      <div id="chat-history-list"></div>
    </div>
  </div>

  <script type="module" src="frontend/history.js"></script>
</body>
</html>
