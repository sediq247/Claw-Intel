<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History — ClawIntel</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-card: #1a1a24;
      --border-color: #2a2a3a;
      --text-primary: #e8e8f0;
      --text-secondary: #a0a0b0;
      --text-muted: #606070;
      --nova: #00e5ff;
      --safe: #00c853;
      --warning: #ffb300;
      --danger: #ff1744;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
    }
    .nav {
      display: flex;
      align-items: center;
      gap: 2rem;
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-secondary);
    }
    .nav-logo { font-size: 1.3rem; font-weight: 700; color: var(--nova); }
    .nav-links { display: flex; gap: 1.5rem; }
    .nav-links a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--nova); }
    .nav-links a.active { color: var(--nova); font-weight: 600; }
    .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
    .page-header { margin-bottom: 2rem; }
    .page-header h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
    .page-header p { color: var(--text-muted); }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.25rem;
    }
    .stat-card .label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; }
    .stat-card .value { font-size: 1.5rem; font-weight: 700; margin-top: 0.25rem; }
    .stat-card.safe { border-left: 3px solid var(--safe); }
    .stat-card.warning { border-left: 3px solid var(--warning); }
    .stat-card.danger { border-left: 3px solid var(--danger); }
    .stat-card.info { border-left: 3px solid var(--nova); }
    .filters {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .filters select, .filters input {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      font-size: 0.85rem;
    }
    .investigation-list { display: flex; flex-direction: column; gap: 0.75rem; }
    .inv-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .inv-card:hover { border-color: var(--nova); transform: translateX(4px); }
    .inv-verdict {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      flex-shrink: 0;
    }
    .inv-verdict.safe { background: rgba(0,200,83,0.1); }
    .inv-verdict.warning { background: rgba(255,179,0,0.1); }
    .inv-verdict.danger { background: rgba(255,23,68,0.1); }
    .inv-info { flex: 1; min-width: 0; }
    .inv-symbol { font-weight: 600; font-size: 1rem; }
    .inv-meta { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.15rem; }
    .inv-confidence { font-size: 0.75rem; color: var(--text-secondary); }
    .inv-time { font-size: 0.75rem; color: var(--text-muted); white-space: nowrap; }
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-muted);
    }
    .loading { text-align: center; padding: 3rem; color: var(--text-muted); }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-logo">ClawIntel</div>
    <div class="nav-links">
      <a href="../index.html">Dashboard</a>
      <a href="history.html" class="active">Records</a>
      <a href="markets.html">Markets</a>
      <a href="analysis.html">Forensic Lab</a>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <h1>Forensics Records</h1>
      <p>Every token the swarm has analyzed, archived and searchable.</p>
    </div>

    <div class="stats-grid" id="stats-grid">
      <div class="stat-card info">
        <div class="label">Total Scanned</div>
        <div class="value" id="stat-total">—</div>
      </div>
      <div class="stat-card safe">
        <div class="label">Safe</div>
        <div class="value" id="stat-safe">—</div>
      </div>
      <div class="stat-card warning">
        <div class="label">Warning</div>
        <div class="value" id="stat-warning">—</div>
      </div>
      <div class="stat-card danger">
        <div class="label">High Risk</div>
        <div class="value" id="stat-risk">—</div>
      </div>
    </div>

    <div class="filters">
      <select id="filter-verdict">
        <option value="">All Verdicts</option>
        <option value="SAFE">Safe</option>
        <option value="WARNING">Warning</option>
        <option value="HIGH_RISK">High Risk</option>
      </select>
      <select id="filter-chain">
        <option value="">All Chains</option>
        <option value="bsc">BSC</option>
        <option value="ethereum">Ethereum</option>
        <option value="solana">Solana</option>
        <option value="base">Base</option>
        <option value="mantle">Mantle</option>
      </select>
      <input type="text" id="search-token" placeholder="Search token address or symbol...">
    </div>

    <div class="investigation-list" id="investigation-list">
      <div class="loading">Loading investigation history...</div>
    </div>
  </div>

  <script type="module" src="history.js"></script>
</body>
</html>
