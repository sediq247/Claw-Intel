<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClawIntel — Markets</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <div class="page-header-left">
      <div class="logo-mark">CI</div>
      <div class="logo-text">CLAW INTEL</div>
      <nav class="page-nav">
        <a href="../index.html" class="nav-link">Detectives</a>
        <a href="markets.html" class="nav-link active">Markets</a>
        <a href="analysis.html" class="nav-link">Forensic Lab</a>
      </nav>
    </div>
    <div class="page-header-right">
      <div class="live-indicator" id="connection-status">
        <div class="live-dot"></div>
        <span id="connection-text">Live</span>
      </div>
    </div>
  </header>

  <div class="page-container">
    <h1 class="page-title">📊 Market Intelligence</h1>
    <p class="page-subtitle">Real-time market data aggregated from CoinGecko and DexScreener.</p>
    
    <div class="tabs" id="market-tabs">
      <button class="tab-btn active" data-tab="trending" onclick="markets.switchTab('trending')">
        🔥 Trending <span class="tab-badge" id="badge-trending">—</span>
      </button>
      <button class="tab-btn" data-tab="gainers" onclick="markets.switchTab('gainers')">
        📈 Top Gainers <span class="tab-badge" id="badge-gainers">—</span>
      </button>
      <button class="tab-btn" data-tab="losers" onclick="markets.switchTab('losers')">
        📉 Top Losers <span class="tab-badge" id="badge-losers">—</span>
      </button>
      <button class="tab-btn" data-tab="ai-verified" onclick="markets.switchTab('ai-verified')">
        🤖 AI Verified <span class="tab-badge" id="badge-ai">—</span>
      </button>
    </div>
    
    <div id="market-content">
      <div class="empty-state" id="loading-state">
        <div class="empty-state-icon"><div class="spinner spinner-lg"></div></div>
        <div class="empty-state-title">Loading Market Data</div>
      </div>
      <div class="empty-state" id="empty-state" style="display:none;">
        <div class="empty-state-icon">📭</div>
        <div class="empty-state-title">No Data Available</div>
      </div>
      <div id="table-view" style="display:none;">
        <table class="data-table" id="market-table">
          <thead><tr>
            <th class="col-rank">#</th><th>Token</th><th>Price</th><th>24h %</th>
            <th>Market Cap</th><th class="col-volume">Volume</th><th class="col-liquidity">Liquidity</th><th>Status</th>
          </tr></thead>
          <tbody id="market-table-body"></tbody>
        </table>
      </div>
      <div id="card-view" class="card-grid" style="display:none;"></div>
    </div>
    
    <div style="margin-top:1.5rem; text-align:center; font-size:0.7rem; color:var(--text-muted); font-family:var(--font-mono);">
      Last updated: <span id="last-updated">—</span>
    </div>
  </div>

  <script src="markets.js" type="module"></script>
</body>
</html>
